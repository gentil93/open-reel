name: Desktop

# Builds the installers. A tag such as v0.1.0 also drafts a release with them;
# otherwise they are kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: open-reel ${{ github.ref_name }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: open-reel-${{ matrix.os }}-${{ matrix.rust-target || 'native' }}
          path: apps/desktop/src-tauri/target/**/release/bundle/
          if-no-files-found: error
