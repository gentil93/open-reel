name: Idea
description: Suggest a feature, a provider or a model
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what gets in your way today. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this
